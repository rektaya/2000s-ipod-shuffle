<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#c7ccd2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- twin cord: earpieces down through an S-bend into one loose loop, out to the jack -->
    <path d="M96,78 C55,110 40,150 68,178 C96,206 150,182 158,150 C164,124 190,150 210,168
             C238,192 210,232 250,252 C300,276 340,248 342,206 C344,166 300,150 268,168
             C244,182 240,214 268,224 C300,236 330,214 338,186
             C346,156 320,132 300,146
             C330,120 380,120 404,96" />
    <path d="M112,86 C70,120 56,156 84,182 C110,208 158,186 166,156 C172,132 196,156 214,172
             C240,194 214,230 252,248 C298,270 334,244 336,206 C338,168 298,154 268,170
             C246,182 242,210 268,220 C296,230 322,210 330,184
             C337,158 314,138 296,150
             C324,126 374,128 398,104" />
  </g>

  <!-- headphone jack -->
  <g>
    <rect x="400" y="90" width="34" height="13" rx="4" fill="#f4f5f6" stroke="#c7ccd2" stroke-width="2.5" transform="rotate(-22 400 96)"/>
    <rect x="424" y="84" width="16" height="9" rx="2" fill="#9a9fa5" transform="rotate(-22 424 88)"/>
  </g>

  <!-- left earpiece -->
  <g transform="translate(72,52) rotate(-10)">
    <circle cx="0" cy="-16" r="10" fill="#f7f8f9" stroke="#c7ccd2" stroke-width="2.2"/>
    <ellipse cx="0" cy="0" rx="21" ry="19" fill="#f7f8f9" stroke="#c7ccd2" stroke-width="2.2"/>
    <line x1="-6" y1="-8" x2="-9" y2="4" stroke="#9a9fa5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- right earpiece -->
  <g transform="translate(150,90) rotate(12)">
    <circle cx="0" cy="-16" r="10" fill="#f7f8f9" stroke="#c7ccd2" stroke-width="2.2"/>
    <ellipse cx="0" cy="0" rx="21" ry="19" fill="#f7f8f9" stroke="#c7ccd2" stroke-width="2.2"/>
    <line x1="6" y1="-8" x2="9" y2="4" stroke="#9a9fa5" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
